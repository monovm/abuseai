; Abuse AI — Queue Workers under Supervisor (no-Horizon setup)
; =============================================================
;
; USE THIS when you don't want Redis/Horizon. Each queue gets its own pool
; of queue:work processes. Uses whatever QUEUE_CONNECTION is set in .env
; (database works fine for small-to-mid volume).
;
; INSTALL
;   sudo cp /var/www/abuseai/deploy/supervisor-workers.conf \
;           /etc/supervisord.d/abuseai-workers.conf       # RHEL/Rocky/CentOS
;     # or /etc/supervisor/conf.d/abuseai-workers.conf    # Debian/Ubuntu
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start abuseai-workers:*
;
; STATUS
;   sudo supervisorctl status | grep abuseai
;
; LOGS
;   tail -f /var/www/abuseai/storage/logs/worker-*.log
;
; AFTER EVERY DEPLOY
;   sudo supervisorctl restart abuseai-workers:*
;
; Notes:
;   - queue:work exits gracefully on SIGTERM, finishing in-flight work.
;   - --tries limits retries; failed jobs still land in failed_jobs table
;     so you can inspect them with  php artisan queue:failed.
;   - --sleep=3 keeps idle workers from hammering the DB when nothing's
;     queued (not relevant on Redis).


; =========================================================================
; Ingestion — feed polling, email parsing, webhooks
; =========================================================================
[program:abuseai-ingestion]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/abuseai/artisan queue:work --queue=ingestion --sleep=3 --tries=3 --timeout=60
directory=/var/www/abuseai
user=abuseai
numprocs=2
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/abuseai/storage/logs/worker-ingestion.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

