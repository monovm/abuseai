; =========================================================================
; Group so you can manage them all with one command
;   supervisorctl start abuseai-workers:*
;   supervisorctl restart abuseai-workers:*   (after every deploy)
;   supervisorctl stop abuseai-workers:*
; =========================================================================
[group:abuseai-workers]
programs=abuseai-ingestion,abuseai-ai-triage,abuseai-enrichment,abuseai-case-engine,abuseai-ai-intel,abuseai-automation,abuseai-ai-comms,abuseai-notifications,abuseai-default
