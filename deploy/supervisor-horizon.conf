; Abuse AI — Laravel Horizon under Supervisor
; =============================================
;
; WHAT THIS DOES
;   Runs `php artisan horizon`, which spawns the worker pools defined in
;   config/horizon.php (one pool per queue: ingestion, ai-triage, enrichment,
;   case-engine, ai-intel, automation, ai-comms, notifications, default).
;   Horizon handles autoscaling, restart-on-deploy, failed-job retention,
;   and metrics at /horizon.
;
; PREREQUISITES
;   - Redis reachable.  Test:   redis-cli -h $REDIS_HOST ping   -> PONG
;   - In .env:
;       QUEUE_CONNECTION=redis
;       REDIS_HOST=127.0.0.1
;       REDIS_PORT=6379
;       HORIZON_PREFIX=abusedesk
;   - If you're migrating off the database queue driver, the existing jobs
;     in the `jobs` table are stranded (Horizon only reads Redis). After
;     confirming Horizon is draining Redis properly, truncate the old table:
;       DELETE FROM jobs;
;
; INSTALL
;   sudo cp /var/www/abuseai/deploy/supervisor-horizon.conf \
;           /etc/supervisord.d/abuseai-horizon.conf        # RHEL/Rocky/CentOS
;     # or /etc/supervisor/conf.d/abuseai-horizon.conf     # Debian/Ubuntu
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start abuseai-horizon
;
; BEFORE FIRST START — verify the PHP binary below is CLI, not CGI:
;   /usr/bin/php -r 'echo PHP_SAPI, PHP_EOL;'       # must print "cli"
; If it prints "cgi-fcgi" / "cgi", replace /usr/bin/php in the `command=` line
; with your CLI PHP path, e.g.:
;   /opt/cpanel/ea-php84/root/usr/bin/php
;   /opt/plesk/php/8.4/bin/php
;   /opt/remi/php84/root/usr/bin/php
; CGI-mode PHP emits Content-Type headers and mis-parses artisan args,
; which corrupts every queue worker subprocess.
;
; STATUS / LOGS
;   sudo supervisorctl status abuseai-horizon
;   php artisan horizon:status
;   tail -f /var/www/abuseai/storage/logs/horizon.log
;
; AFTER EVERY DEPLOY
;   # Tells Horizon to finish in-flight jobs and exit. Supervisor restarts it
;   # with the freshly-deployed code.
;   php artisan horizon:terminate

[program:abuseai-horizon]
process_name=%(program_name)s
; NOTE: use bare `php`, not /usr/bin/php. On this cPanel box /usr/bin/php
; is the CGI binary — it emits Content-Type headers and mis-parses
; artisan's arguments, so worker subprocesses just print the help page
; and die. The bare `php` resolves via cPanel's per-user PATH to the
; correct CLI binary for this account (same pattern the working
; seoos-horizon supervisor unit uses).
command=php /var/www/abuseai/artisan horizon
directory=/var/www/abuseai
user=abuseai
numprocs=1
autostart=true
autorestart=true
; Horizon shuts down cleanly on SIGTERM — finishes in-flight jobs first.
stopsignal=SIGTERM
; Give long-running AI jobs (up to 180 s per config/horizon.php) time to wrap
; up before supervisor resorts to SIGKILL.
stopwaitsecs=3600
; Horizon forks per-queue worker children; make sure supervisor cleans up the
; whole process group on stop/restart, not just the parent.
stopasgroup=true
killasgroup=true
; Consolidated logs — both stdout and stderr go to horizon.log.
redirect_stderr=true
stdout_logfile=/var/www/abuseai/storage/logs/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/home/abuseai"
