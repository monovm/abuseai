# Abuse AI — Supervisor Configuration
# ====================================
#
# WHAT THIS DOES:
#   Runs Laravel scheduler every 60 seconds, which triggers:
#     - abuse:poll-mailbox      every 2 min   (fetch emails → create cases → send ACK)
#     - abuse:poll-feeds        every 15 min  (AbuseIPDB feed)
#     - abuse:check-abuseipdb   every 6 hrs   (scan IPs vs AbuseIPDB)
#     - abuse:check-dnsbl       twice daily   (check IPs vs DNSBL blacklists)
#
# INSTALL:
#   cp /var/www/abuseai/deploy/supervisor-scheduler.conf /etc/supervisor/conf.d/abuseai.conf
#   supervisorctl reread
#   supervisorctl update
#
# CHECK STATUS:
#   supervisorctl status
#
# VIEW LOGS:
#   tail -f /var/www/abuseai/storage/logs/scheduler.log

[program:abuseai-scheduler]
process_name=%(program_name)s
; Use bare `php` (not /usr/bin/php) so cPanel's per-user PATH resolves
; to the correct CLI binary — /usr/bin/php on this host is CGI.
command=/bin/bash -c "while true; do php /var/www/abuseai/artisan schedule:run --no-interaction >> /var/www/abuseai/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
user=abuseai
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/abuseai/storage/logs/scheduler-supervisor.log
stopwaitsecs=60
