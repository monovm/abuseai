name: Publish Docker image

# Builds the multi-arch Abuse AI image, publishes it to Docker Hub, then
# mirrors the finished manifest to the GitHub Container Registry and syncs
# the Docker Hub repository description from docs/dockerhub-description.md.
#
# Each architecture is built on a NATIVE runner and pushed by digest, then a
# merge job stitches the digests into one multi-arch manifest. Building
# linux/arm64 under QEMU emulation on an amd64 runner instead takes roughly an
# order of magnitude longer.
#
# GHCR is deliberately a separate, non-blocking job rather than a second push
# target on the build: it is a convenience mirror, and a hiccup there must not
# fail a release that already landed on Docker Hub.
#
# Triggers:
#   - pushing a version tag (v1.2.3) — publishes 1.2.3, 1.2, 1, latest
#   - pushing to the default branch  — publishes the `edge` tag
#   - manual run via the Actions tab
#
# Required repository (or organization) secrets:
#   DOCKERHUB_USERNAME — Docker Hub account name. For an ORGANIZATION access
#                        token this must be the organization name itself.
#   DOCKERHUB_TOKEN    — Docker Hub access token with Image Push permission.
#                        The description sync additionally requires
#                        read/write/delete scope; with a narrower token that
#                        (non-blocking) job fails while the release still
#                        publishes normally.
# (GHCR uses the built-in GITHUB_TOKEN — no secret needed.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: monovmcom/abuseai.io
  GHCR_IMAGE: ghcr.io/monovm/abuseai

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Sanitise platform name for artifact naming
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}

      # Pushed by digest only — no tags yet. The merge job below applies the
      # tags to the combined manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and tag
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive Docker Hub tags
        id: hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main

      # Values are passed via env rather than interpolated into the script body.
      - name: Push Docker Hub manifest
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ steps.hub.outputs.json }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$META_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published manifest
        env:
          META_JSON: ${{ steps.hub.outputs.json }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$(jq -cr '.tags[0]' <<<"$META_JSON")"

  # Convenience mirror. Copies the finished multi-arch index straight from
  # Docker Hub, so it cannot affect the release: continue-on-error keeps a GHCR
  # outage from turning a successful publish red.
  mirror-ghcr:
    name: Mirror to GHCR
    runs-on: ubuntu-latest
    needs: [merge]
    continue-on-error: true
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Docker Hub tags
        id: hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main

      - name: Derive GHCR tags
        id: ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main

      # Any Docker Hub tag works as the source — they all reference the same
      # content-addressed index that the merge job just created.
      - name: Copy manifest to GHCR
        env:
          HUB_JSON: ${{ steps.hub.outputs.json }}
          GHCR_JSON: ${{ steps.ghcr.outputs.json }}
        run: |
          set -euo pipefail
          src=$(jq -cr '.tags[0]' <<<"$HUB_JSON")
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$GHCR_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args "$src"
          docker buildx imagetools inspect "$(jq -cr '.tags[0]' <<<"$GHCR_JSON")"

  # Keeps the Docker Hub repository page in sync with the checked-in
  # description. Gated on merge so a failed release never rewrites the page,
  # and non-blocking for the same reason as the GHCR mirror: a metadata
  # hiccup must not fail a release that already landed.
  sync-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: [merge]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update Docker Hub repository description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: AI-powered abuse desk for hosting companies and ISPs — triage, score, and action abuse reports.
          readme-filepath: ./docs/dockerhub-description.md
