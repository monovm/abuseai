name: Feature request
description: Suggest a new capability or behaviour.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please file feature requests *before* writing the code. Big PRs
        opened without prior discussion may be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user / operator problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Abuse AI do, ideally? Sketch the UX or API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've considered, and why this one wins.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, related issues, scale you operate at, etc.
