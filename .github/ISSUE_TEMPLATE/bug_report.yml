name: Bug report
description: Something isn't working as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not file security issues here** —
        see [SECURITY.md](../../blob/main/SECURITY.md) for the private
        disclosure process.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Smallest reproduction you can manage. Include any seed data, env
        flags, queue config, or specific report payloads needed.
      placeholder: |
        1. Run `php artisan migrate --seed`
        2. POST a report to `/api/v1/reports` with body `{...}`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse --short HEAD` or the release tag.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: PHP version, database (pgsql/mysql/sqlite), queue driver, AI provider, etc.
      placeholder: |
        PHP 8.3.10
        PostgreSQL 16
        Queue: redis (Horizon)
        AI: claude-sonnet-4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste lines from `storage/logs/laravel.log`, Horizon, or the failed
        job payload. **Redact API keys, customer emails, and IPs.**
      render: shell
